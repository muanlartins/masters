[project]
name = "masters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "pandas>=2.0",
    "pybind11>=3.0.4",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "setuptools>=82.0.1",
    "torch",
    "tqdm>=4.67.3",
    "wisardpkg @ git+https://github.com/muanlartins/wisardpkg.git@muanlartins",
]

[tool.uv.extra-build-dependencies]
wisardpkg = ["pybind11", "setuptools"]

[dependency-groups]
dev = [
    "nbconvert>=7.17.1",
]
